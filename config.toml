base_url = "https://schembora.github.io"
title = "Andrew Schembor"
description = "Senior Software Engineer at Amazon Web Services (AWS)"
default_language = "en"
theme = "cela"
compile_sass = false
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = true

taxonomies = [
  {name = "tags", feed = true},
  {name = "categories", feed = true},
]

[search]
index_format = "fuse_json"

[markdown]
render_emoji = true

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
toc_open = false

[extra.cela]
header_title = "Andrew Schembor"
date_format = "%Y-%m-%d"
show_home_title = true
home_title = "Andrew Schembor"
home_content_dir = "blog"
home_list_style = "default"
show_home_content = true
home_content = "Senior Software Engineer at Amazon Web Services (AWS)"
show_home_social_icons = true
social_icons = [
  {path = "https://github.com/schembora", title = "GitHub", icon = "github"},
  {path = "mailto:schembora@gmail.com", title = "Email", icon = "email"},
  {path = "/atom.xml", title = "RSS", icon = "rss"},
]
navigation = [
  {path = "/", title = "Archive", title_key = "nav_archive"},
  {path = "/tags", title = "Tags", title_key = "nav_tags"},
  {path = "#", title = "Search", title_key = "nav_search", is_search = true},
]
show_cela_logo = false
show_code_copy_buttons = true
show_header_title = true
show_post_meta = true
show_reading_time = true
show_scroll_to_top = true
show_theme_toggle = true
show_toc = true
unfold_toc = true
show_word_count = false

[extra.cela.color]
default_theme = "dark"
remember_choice = true

[extra.cela.global]
title_show = true
title_prefix = ""
language_directions = { en = "ltr" }
